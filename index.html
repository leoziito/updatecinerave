<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CINERAVE+ | Filmes e Séries</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .scroll-smooth-ios { -webkit-overflow-scrolling: touch; }

        .banner-gradient { background: linear-gradient(to top, rgba(0, 0, 0, 1) 0%, rgba(0, 0, 0, 0.4) 50%, rgba(0, 0, 0, 0) 100%); }
        .modal-gradient { background: linear-gradient(to top, rgba(10, 10, 10, 1) 5%, rgba(10, 10, 10, 0.9) 30%, rgba(10, 10, 10, 0) 100%); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }

        @keyframes slideUpFade { from { opacity: 0; transform: translateY(20px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-modal { animation: slideUpFade 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes popIn { 0% { transform: scale(0.85); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .poster-card { transition: all 0.25s cubic-bezier(0.25, 0.8, 0.25, 1); transform-origin: center bottom; }
        .poster-card:hover { transform: scale(1.08) translateY(-5px); box-shadow: 0 10px 25px -5px rgba(96, 165, 250, 0.3); z-index: 20; }
        
        select option { background-color: #000; color: #fff; }
    </style>
</head>

    <!-- APP SCRIPTS -->
    <script>
        const API_KEY = 'd0f7e2c414b1efff7b000ae9b681ed1b';
        const BASE_URL = 'https://api.themoviedb.org/3';
        const IMG_URL = 'https://image.tmdb.org/t/p/w500';
        const BG_URL = 'https://image.tmdb.org/t/p/original';

        let appState = { tab: 'home', modalOpen: false, playerOpen: false, playerUrl: '', playerTitle: '' };

        function initHistory() {
            history.replaceState(appState, '', '');
            window.addEventListener('popstate', (e) => {
                if (e.state) applyStateVisuals(e.state);
                else applyStateVisuals({ tab: 'home', modalOpen: false, playerOpen: false, playerUrl: '', playerTitle: '' });
            });
        }

        function navigate(newState) {
            history.pushState(newState, '', '');
            applyStateVisuals(newState);
        }

        function navigateBack() {
            if (window.history.state !== null && window.history.length > 1) window.history.back(); 
            else navigate({ tab: appState.tab, modalOpen: false, playerOpen: false, playerUrl: '', playerTitle: '' });
        }

        function applyStateVisuals(state) {
            appState = state;
            renderTabVisuals(state.tab);
            state.modalOpen ? showModalVisuals() : hideModalVisuals();
            state.playerOpen ? showPlayerVisuals(state.playerUrl, state.playerTitle) : hidePlayerVisuals();
        }

        const dataState = {
            bannerItems: [], bannerIndex: 0, bannerInterval: null,
            searchPage: 1, searchQuery: '', searchType: 'multi',
            isSearching: false, hasMoreSearch: true, exploreEndpoint: '', exploreParams: '',
            currentMediaId: null, currentMediaType: null, currentSeason: 1
        };

        // FETCH TMDB COM ANTI-CACHE (Garante que novos episódios apareçam em TEMPO REAL)
        async function fetchTMDB(endpoint, params = '') {
            try {
                const noCache = `&_t=${new Date().getTime()}`;
                const res = await fetch(`${BASE_URL}${endpoint}?api_key=${API_KEY}&language=pt-BR${params}${noCache}`, { cache: 'no-store' });
                return await res.json();
            } catch (error) { return { results: [] }; }
        }

        async function initApp() {
            initHistory();
            await loadBanner();
            loadHomeRows();
            loadExploreGrid(); 
        }

        async function loadBanner() {
            const data = await fetchTMDB('/trending/all/day');
            if (data.results?.length > 0) {
                dataState.bannerItems = data.results.slice(0, 10).filter(i => i.backdrop_path);
                renderBanner(0);
                startBannerInterval();
            }
        }

        function startBannerInterval() {
            clearInterval(dataState.bannerInterval);
            dataState.bannerInterval = setInterval(() => {
                dataState.bannerIndex = (dataState.bannerIndex + 1) % dataState.bannerItems.length;
                renderBanner(dataState.bannerIndex);
            }, 6000);
        }

        async function fetchLogo(id, mediaType) {
            try {
                const res = await fetchTMDB(`/${mediaType}/${id}/images`, '&include_image_language=pt,en,null');
                if (res.logos && res.logos.length > 0) {
                    const pt = res.logos.find(l => l.iso_639_1 === 'pt');
                    const en = res.logos.find(l => l.iso_639_1 === 'en');
                    return (pt || en || res.logos[0]).file_path;
                }
            } catch(e) {}
            return null;
        }

        function renderBanner(index) {
            const item = dataState.bannerItems[index];
            if (!item) return;

            const bgEl = document.getElementById('banner-bg');
            const logoEl = document.getElementById('banner-logo');
            const indicatorsEl = document.getElementById('banner-indicators');

            bgEl.style.backgroundImage = `url(${BG_URL}${item.backdrop_path})`;
            logoEl.classList.remove('fade-in'); logoEl.classList.add('opacity-0');
            
            if (item.logoPath === undefined) {
                fetchLogo(item.id, item.media_type || 'movie').then(path => {
                    item.logoPath = path;
                    if (dataState.bannerIndex === index) showBannerLogo(path);
                });
            } else showBannerLogo(item.logoPath);

            function showBannerLogo(path) {
                if (path) { logoEl.src = IMG_URL + path; void logoEl.offsetWidth; logoEl.classList.add('fade-in'); } 
                else logoEl.src = '';
            }

            indicatorsEl.innerHTML = dataState.bannerItems.map((_, i) => `
                <div class="h-1.5 rounded-full transition-all duration-300 ${i === index ? 'bg-white w-6 shadow-[0_0_8px_rgba(255,255,255,0.8)]' : 'bg-white/40 w-1.5'}"></div>
            `).join('');
        }

        function handleBannerClick() {
            const item = dataState.bannerItems[dataState.bannerIndex];
            if (item) handleOpenDetails(item.id, item.media_type || (item.title ? 'movie' : 'tv'));
        }

        // --- SISTEMA DE ATUALIZAÇÃO AUTOMÁTICA (LÊ OS TXTS DA API) ---
        async function fetchServerCatalog(filename, tmdbType, limit = 15) {
            try {
                // Lê o TXT direto do servidor da API (garantindo sincronia total com o catálogo real)
                const res = await fetch(`https://redeflixapi.store/${filename}?_t=${Date.now()}`);
                if (!res.ok) return null;
                const text = await res.text();
                // Pega os IDs mais recentes (topo da lista)
                const ids = text.split('\n').map(id => id.trim()).filter(id => id).slice(0, limit);
                
                // Converte IDs em dados visuais do TMDB
                const promises = ids.map(id => fetchTMDB(`/${tmdbType}/${id}`));
                const results = await Promise.all(promises);
                return results.filter(i => i && !i.success === false && i.poster_path);
            } catch (e) {
                console.warn(`Fallback ativado para ${filename}`);
                return null; // Fallback para TMDB normal se o TXT falhar
            }
        }

        async function loadHomeRows() {
            const container = document.getElementById('home-rows');
            
            // 1. Tenta carregar exatamente o que foi adicionado no servidor
            const serverMovies = await fetchServerCatalog('list-movie-ids.txt', 'movie');
            const serverTv = await fetchServerCatalog('list-tv-ids.txt', 'tv');
            
            document.getElementById('home-loading')?.remove(); // Remove spinner

            // Filmes
            if (serverMovies && serverMovies.length > 0) {
                container.insertAdjacentHTML('beforeend', buildRow('Adicionados Recentemente (Filmes)', serverMovies, 'movie'));
            } else {
                const fData = await fetchTMDB('/movie/now_playing');
                container.insertAdjacentHTML('beforeend', buildRow('Lançamentos em Filmes', fData.results, 'movie'));
            }

            // Séries
            if (serverTv && serverTv.length > 0) {
                container.insertAdjacentHTML('beforeend', buildRow('Novos Episódios e Séries', serverTv, 'tv'));
            } else {
                const sData = await fetchTMDB('/tv/popular');
                container.insertAdjacentHTML('beforeend', buildRow('Séries em Alta', sData.results, 'tv'));
            }

            // Categorias fixas atualizadas via TMDB
            const animes = await fetchTMDB('/discover/tv', '&with_genres=16&with_original_language=ja');
            if(animes.results) container.insertAdjacentHTML('beforeend', buildRow('Animes Atualizados', animes.results, 'tv'));

            const doramas = await fetchTMDB('/discover/tv', '&with_original_language=ko');
            if(doramas.results) container.insertAdjacentHTML('beforeend', buildRow('Doramas Recentes', doramas.results, 'tv'));
        }

        function buildRow(title, items, type) {
            const cards = items.map(item => `
                <div class="poster-card flex-none w-[105px] md:w-44 lg:w-52 cursor-pointer relative group rounded-xl overflow-hidden bg-gray-900 border border-gray-800" 
                     onclick="handleOpenDetails(${item.id}, '${type}')">
                    <img src="${IMG_URL}${item.poster_path}" alt="${item.title || item.name}" 
                         class="w-full h-auto object-cover aspect-[2/3] transform group-hover:scale-110 transition-transform duration-500" loading="lazy">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-2 md:p-3">
                        <i class="ph-fill ph-play-circle text-3xl md:text-4xl text-blue-500 self-center mb-auto mt-auto drop-shadow-[0_0_15px_rgba(59,130,246,0.8)]"></i>
                        <span class="text-white text-[10px] md:text-xs font-bold truncate">${item.title || item.name}</span>
                    </div>
                </div>
            `).join('');

            return `
                <div class="w-full relative z-10">
                    <div class="flex items-center gap-3 mb-3 md:mb-4">
                        <div class="w-1.5 h-5 bg-blue-500 rounded-full shadow-[0_0_10px_rgba(59,130,246,0.8)]"></div>
                        <h3 class="text-lg md:text-2xl font-bold text-white tracking-wide">${title}</h3>
                    </div>
                    <div class="flex overflow-x-auto gap-3 md:gap-5 pb-4 md:pb-6 hide-scrollbar px-1 scroll-smooth-ios">
                        ${cards}
                    </div>
                </div>
            `;
        }

        // --- ABAS ---
        function handleTabClick(tabName) {
            if(appState.tab === tabName && !appState.modalOpen && !appState.playerOpen) return;
            navigate({ tab: tabName, modalOpen: false, playerOpen: false, playerUrl: '', playerTitle: '' });
        }

        function renderTabVisuals(tabName) {
            const views = { home: document.getElementById('view-home'), search: document.getElementById('view-search') };
            const tabs = { home: document.getElementById('tab-home'), search: document.getElementById('tab-search') };
            const inds = { home: document.getElementById('home-indicator'), search: document.getElementById('search-indicator') };

            Object.keys(views).forEach(key => {
                if (key === tabName) {
                    views[key].classList.remove('hidden'); setTimeout(() => views[key].classList.remove('opacity-0'), 50);
                    tabs[key].classList.remove('text-gray-500'); tabs[key].classList.add('text-blue-400');
                    tabs[key].querySelector('i').classList.replace('ph', 'ph-fill'); inds[key].classList.remove('hidden');
                } else {
                    views[key].classList.add('opacity-0'); setTimeout(() => views[key].classList.add('hidden'), 300);
                    tabs[key].classList.remove('text-blue-400'); tabs[key].classList.add('text-gray-500');
                    tabs[key].querySelector('i').classList.replace('ph-fill', 'ph'); inds[key].classList.add('hidden');
                }
            });
            if(tabName === 'home' && !appState.playerOpen && !appState.modalOpen) startBannerInterval();
            else clearInterval(dataState.bannerInterval);
        }

        // --- BUSCA / EXPLORAR ---
        let searchTimeout;
        const searchInput = document.getElementById('search-input');
        const searchFilter = document.getElementById('search-filter');
        const resultsContainer = document.getElementById('search-results');
        const searchTitle = document.getElementById('search-title');
        
        searchInput.addEventListener('input', handleSearchEvent);
        searchFilter.addEventListener('change', () => { 
            dataState.searchType = searchFilter.value; dataState.searchPage = 1;
            searchInput.value.trim().length > 0 ? performSearch() : loadExploreGrid();
        });

        function handleSearchEvent() {
            clearTimeout(searchTimeout);
            const query = searchInput.value.trim();
            searchTimeout = setTimeout(() => {
                if (query.length > 0) {
                    dataState.searchQuery = query; dataState.searchPage = 1; dataState.hasMoreSearch = true;
                    resultsContainer.innerHTML = ''; searchTitle.innerHTML = `Resultados: <span class="text-blue-400">"${query}"</span>`;
                    performSearch();
                } else {
                    dataState.searchQuery = ''; loadExploreGrid();
                }
            }, 600);
        }

        async function loadExploreGrid() {
            dataState.isSearching = true; dataState.searchPage = 1;
            resultsContainer.innerHTML = ''; document.getElementById('search-loading').classList.remove('hidden');

            let endpoint = '', params = '', titleStr = '';
            switch(dataState.searchType) {
                case 'movie': endpoint = '/movie/now_playing'; titleStr = 'Filmes Populares'; break;
                case 'tv': endpoint = '/tv/popular'; titleStr = 'Séries em Alta'; break;
                case 'dorama': endpoint = '/discover/tv'; params = '&with_original_language=ko'; titleStr = 'Doramas em Destaque'; break;
                case 'soap': endpoint = '/discover/tv'; params = '&with_genres=10766'; titleStr = 'Novelas'; break;
                case 'reality': endpoint = '/discover/tv'; params = '&with_genres=10764'; titleStr = 'Reality Shows'; break;
                default: endpoint = '/trending/all/week'; titleStr = 'Em Alta na Semana'; break;
            }

            searchTitle.textContent = titleStr;
            dataState.exploreEndpoint = endpoint; dataState.exploreParams = params;
            const data = await fetchTMDB(endpoint, params + `&page=${dataState.searchPage}`);
            
            document.getElementById('search-loading').classList.add('hidden');
            dataState.isSearching = false;

            if (data.results?.length > 0) { renderGridItems(data.results); dataState.searchPage++; dataState.hasMoreSearch = data.total_pages > 1; } 
            else dataState.hasMoreSearch = false;
        }

        async function performSearch() {
            if (dataState.isSearching || !dataState.hasMoreSearch) return;
            dataState.isSearching = true; document.getElementById('search-loading').classList.remove('hidden');

            let searchApiType = 'multi';
            if (['tv', 'dorama', 'soap', 'reality'].includes(dataState.searchType)) searchApiType = 'tv';
            else if (dataState.searchType === 'movie') searchApiType = 'movie';

            dataState.exploreEndpoint = `/search/${searchApiType}`;
            dataState.exploreParams = `&query=${encodeURIComponent(dataState.searchQuery)}`;
            const data = await fetchTMDB(dataState.exploreEndpoint, dataState.exploreParams + `&page=${dataState.searchPage}`);
            
            if (data.results?.length > 0) { renderGridItems(data.results); dataState.searchPage++; if (dataState.searchPage > data.total_pages) dataState.hasMoreSearch = false; } 
            else if (dataState.searchPage === 1) {
                resultsContainer.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center py-16 text-gray-500"><i class="ph ph-mask-sad text-5xl mb-3 opacity-50"></i><p class="text-sm md:text-lg text-center">Nenhum resultado encontrado.</p></div>`;
                dataState.hasMoreSearch = false;
            }
            dataState.isSearching = false; document.getElementById('search-loading').classList.add('hidden');
        }

        async function loadMoreGridItems() {
            if (dataState.isSearching || !dataState.hasMoreSearch) return;
            dataState.isSearching = true; document.getElementById('search-loading').classList.remove('hidden');
            const data = await fetchTMDB(dataState.exploreEndpoint, dataState.exploreParams + `&page=${dataState.searchPage}`);
            document.getElementById('search-loading').classList.add('hidden');
            dataState.isSearching = false;
            if (data.results?.length > 0) { renderGridItems(data.results); dataState.searchPage++; if (dataState.searchPage > data.total_pages) dataState.hasMoreSearch = false; } 
            else dataState.hasMoreSearch = false;
        }

        function renderGridItems(items) {
            const validItems = items.filter(i => (i.media_type === 'movie' || i.media_type === 'tv' || !i.media_type) && i.poster_path);
            validItems.forEach(item => {
                let mType = item.media_type; 
                if(!mType) mType = ['dorama', 'soap', 'reality'].includes(dataState.searchType) ? 'tv' : (dataState.searchType === 'multi' ? (item.title ? 'movie' : 'tv') : dataState.searchType);
                const typeLabel = mType === 'movie' ? 'FILME' : 'SÉRIE';
                
                const card = document.createElement('div');
                card.className = "poster-card w-full cursor-pointer relative group rounded-xl overflow-hidden bg-gray-900 border border-gray-800 animate-pop shadow-sm";
                card.onclick = () => handleOpenDetails(item.id, mType);
                card.innerHTML = `
                    <img src="${IMG_URL}${item.poster_path}" alt="Poster" class="w-full h-auto object-cover aspect-[2/3] transform group-hover:scale-110 transition-transform duration-500" loading="lazy">
                    <div class="absolute top-1.5 right-1.5 md:top-2 md:right-2 bg-black/70 backdrop-blur-md px-1.5 py-0.5 rounded text-[8px] md:text-[10px] font-bold text-blue-400 border border-blue-900/50 uppercase">${typeLabel}</div>
                    <div class="absolute inset-0 bg-gradient-to-t from-black/95 via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-2 md:p-3">
                        <i class="ph-fill ph-play-circle text-2xl md:text-4xl text-blue-500 self-center mb-auto mt-auto drop-shadow-[0_0_15px_rgba(59,130,246,0.8)]"></i>
                        <span class="text-white text-[10px] md:text-sm font-bold line-clamp-2 md:truncate leading-tight">${item.title || item.name}</span>
                    </div>
                `;
                resultsContainer.appendChild(card);
            });
        }

        window.addEventListener('scroll', () => { if (appState.tab === 'search') { if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) loadMoreGridItems(); } });

        // --- MODAL DETALHES ---
        async function handleOpenDetails(id, mediaType) {
            dataState.currentMediaId = id; dataState.currentMediaType = mediaType; dataState.currentSeason = 1;
            document.getElementById('modal-actions').innerHTML = '<div class="flex justify-center p-6"><i class="ph ph-circle-notch animate-spin text-3xl text-blue-500"></i></div>';
            navigate({ tab: appState.tab, modalOpen: true, playerOpen: false, playerUrl: '', playerTitle: '' });

            // Fetch Real-time Anti-cache
            const details = await fetchTMDB(`/${mediaType}/${id}`);
            
            document.getElementById('modal-bg').style.backgroundImage = `url(${BG_URL}${details.backdrop_path || details.poster_path})`;
            document.getElementById('modal-poster').src = `${IMG_URL}${details.poster_path}`;
            document.getElementById('modal-title').textContent = details.title || details.name;
            document.getElementById('modal-year').textContent = (details.release_date || details.first_air_date || 'N/A').split('-')[0];
            document.getElementById('modal-type').textContent = mediaType === 'movie' ? 'Filme' : 'Série';
            document.getElementById('modal-rating').innerHTML = `<i class="ph-fill ph-star"></i> ${(details.vote_average || 0).toFixed(1)}`;
            document.getElementById('modal-overview').textContent = details.overview || 'Sinopse não disponível.';

            const actionsContainer = document.getElementById('modal-actions');
            if (mediaType === 'movie') {
                actionsContainer.innerHTML = `<button onclick="handlePlayMovie(${id})" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 md:py-4 px-6 rounded-xl flex justify-center items-center gap-3 transition-all transform hover:scale-[1.02] shadow-[0_0_20px_rgba(37,99,235,0.4)] text-sm md:text-lg"><i class="ph-fill ph-play-circle text-2xl md:text-3xl"></i><span>Reproduzir Filme</span></button>`;
            } else buildSeriesSelector(details);
        }

        function showModalVisuals() {
            const modal = document.getElementById('details-modal'), content = document.getElementById('modal-content');
            modal.classList.remove('hidden'); document.body.style.overflow = 'hidden';
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95', 'opacity-0'); content.classList.add('animate-modal'); modal.scrollTop = 0; }, 10);
            clearInterval(dataState.bannerInterval);
        }

        function hideModalVisuals() {
            const modal = document.getElementById('details-modal'), content = document.getElementById('modal-content');
            modal.classList.add('opacity-0'); content.classList.remove('animate-modal'); content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); if(!appState.playerOpen) document.body.style.overflow = ''; }, 150);
            if(appState.tab === 'home' && !appState.playerOpen) startBannerInterval();
        }

        async function buildSeriesSelector(showDetails) {
            const actionsContainer = document.getElementById('modal-actions');
            const seasons = showDetails.seasons.filter(s => s.season_number > 0);
            if (seasons.length === 0) { actionsContainer.innerHTML = '<p class="text-gray-400 text-center text-sm">Nenhum episódio.</p>'; return; }

            actionsContainer.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-center gap-3 mb-4 pb-4 border-b border-gray-800">
                    <h4 class="text-white font-bold text-sm md:text-lg flex items-center gap-2"><i class="ph ph-list-numbers text-blue-400 text-xl"></i> Episódios</h4>
                    <div class="relative w-full sm:w-48">
                        <select id="season-select" onchange="loadEpisodes(this.value)" class="w-full appearance-none bg-black border border-gray-700 text-white py-2 px-4 pr-8 rounded-lg outline-none focus:border-blue-500 text-sm font-medium cursor-pointer shadow-inner">
                            ${seasons.map(s => `<option value="${s.season_number}">Temporada ${s.season_number}</option>`).join('')}
                        </select>
                        <i class="ph-bold ph-caret-down absolute right-3 top-1/2 transform -translate-y-1/2 text-blue-400 pointer-events-none"></i>
                    </div>
                </div>
                <div id="episodes-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-[35vh] md:max-h-[400px] overflow-y-auto pr-2 scroll-smooth-ios"></div>
            `;
            loadEpisodes(seasons[0].season_number); // A série atualiza episódios em tempo real
        }

        async function loadEpisodes(seasonNumber) {
            dataState.currentSeason = seasonNumber;
            const epsContainer = document.getElementById('episodes-list');
            epsContainer.innerHTML = '<div class="col-span-full flex justify-center py-4"><i class="ph ph-circle-notch animate-spin text-2xl text-blue-500"></i></div>';
            
            const data = await fetchTMDB(`/tv/${dataState.currentMediaId}/season/${seasonNumber}`);
            if (data.episodes?.length > 0) {
                epsContainer.innerHTML = data.episodes.map(ep => `
                    <button onclick="handlePlayEpisode(${ep.episode_number})" class="flex flex-col text-left bg-black hover:bg-blue-900/20 border border-gray-800 hover:border-blue-500/50 rounded-xl p-3 transition-all group relative overflow-hidden">
                        <div class="flex justify-between items-start w-full mb-1 z-10">
                            <span class="font-black text-gray-300 group-hover:text-blue-400 text-sm md:text-base">T${seasonNumber}:E${ep.episode_number}</span>
                            <div class="w-7 h-7 rounded-full bg-gray-800 group-hover:bg-blue-600 flex items-center justify-center transition-colors shadow-lg"><i class="ph-fill ph-play text-white text-xs"></i></div>
                        </div>
                        <span class="text-xs text-gray-400 group-hover:text-gray-200 line-clamp-2 z-10 pr-2">${ep.name || `Episódio ${ep.episode_number}`}</span>
                    </button>
                `).join('');
            } else epsContainer.innerHTML = '<p class="text-gray-500 text-center text-sm col-span-full py-4">Nenhum episódio cadastrado.</p>';
        }

        // --- PLAYER ---
        function handlePlayMovie(tmdbId) { navigate({ tab: appState.tab, modalOpen: false, playerOpen: true, playerUrl: `https://redeflixapi.store/filme/${tmdbId}` }); }
        function handlePlayEpisode(episodeNumber) { navigate({ tab: appState.tab, modalOpen: false, playerOpen: true, playerUrl: `https://redeflixapi.store/serie/${dataState.currentMediaId}/${dataState.currentSeason}/${episodeNumber}` }); }

        function showPlayerVisuals(iframeUrl) {
            const overlay = document.getElementById('player-overlay'), header = document.getElementById('player-header'), iframe = document.getElementById('video-iframe');
            clearInterval(dataState.bannerInterval); document.body.style.overflow = 'hidden';
            if(iframe.src !== iframeUrl) iframe.src = iframeUrl;
            overlay.classList.remove('hidden'); setTimeout(() => { overlay.classList.remove('opacity-0'); header.classList.remove('-translate-y-full'); }, 10);
        }

        function hidePlayerVisuals() {
            const overlay = document.getElementById('player-overlay'), header = document.getElementById('player-header'), iframe = document.getElementById('video-iframe');
            overlay.classList.add('opacity-0'); header.classList.add('-translate-y-full');
            setTimeout(() => { iframe.src = ''; overlay.classList.add('hidden'); if(!appState.modalOpen) document.body.style.overflow = ''; }, 150);
            if(appState.tab === 'home' && !appState.modalOpen) startBannerInterval();
        }

        window.onload = initApp;
    </script>
</body>
</html>
